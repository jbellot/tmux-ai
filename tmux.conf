# tmux-ai — full daily-driver config.
#
# This file is the single entrypoint. It sources the agent-layer
# snippet (tmux-ai.tmux.conf) at the bottom.
#
# Users: symlink this from ~/.tmux.conf (via `./install.sh --full`)
#        or source-file it from your own tmux.conf.

# =========================================================================
# Core behaviour
# =========================================================================
set -g prefix C-b
bind C-b send-prefix

set -g mouse off
set -g escape-time 0
set -g history-limit 50000
set -g focus-events on

set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

set -g default-terminal 'tmux-256color'
set -ga terminal-overrides ',*256col*:Tc'
set -ga terminal-features 'xterm-256color:RGB'

# =========================================================================
# Palette — override any @tmux-ai-<role> BEFORE sourcing to retheme.
# Defaults are Kanagawa Wave.
# =========================================================================
set -g @tmux-ai-accent '#7e9cd8'
set -g @tmux-ai-fg     '#dcd7ba'
set -g @tmux-ai-dim    '#727169'
set -g @tmux-ai-sep    '#363646'
set -g @tmux-ai-ok     '#98bb6c'
set -g @tmux-ai-wait   '#dca561'
set -g @tmux-ai-stuck  '#e82424'
set -g @tmux-ai-sidebar-width '32'

# Pane borders — single lines, accent on active only.
set -g pane-border-lines        single
set -g pane-border-style        'fg=#{E:@tmux-ai-sep}'
set -g pane-active-border-style 'fg=#{E:@tmux-ai-accent}'

# =========================================================================
# Status bar — transparent bg, left-aligned tabs, palette-driven colors.
# Note: tmux needs the `E:` prefix (`#{E:@tmux-ai-*}`) to expand
# user-options inside style= contexts. Without `E:`, the literal string
# `#{@tmux-ai-accent}` would pass through to the renderer unchanged.
# =========================================================================
set -g status-style        'bg=default fg=#{E:@tmux-ai-fg}'
set -g status-justify      left
set -g status-left-length  60
set -g status-right-length 60
set -g status-interval     2

# Window tabs — underline + accent for active, plain fg for inactive.
# Dot separator between tabs sits on top of an empty window-status-separator
# so the dot only ever appears between (not around) the tabs.
set -g window-status-format \
  '#[fg=#{E:@tmux-ai-fg}] #I #W #[fg=#{E:@tmux-ai-sep}]·'
set -g window-status-current-format \
  '#[fg=#{E:@tmux-ai-accent},underscore] #I #W #[nounderscore,fg=#{E:@tmux-ai-sep}]·'
set -g window-status-separator ''

# Left: [◌ ] ◉ <session> │
# The DND prefix is conditional on $XDG_RUNTIME_DIR/tmux-ai/dnd.flag and
# uses the wait-amber so it reads as "heads up, notifications are off".
set -g status-left \
  '#{?#(test -f $XDG_RUNTIME_DIR/tmux-ai/dnd.flag && echo 1),#[fg=#{E:@tmux-ai-wait}]◌ ,}#[fg=#{E:@tmux-ai-accent},bold]◉ #S #[nobold,fg=#{E:@tmux-ai-sep}]│ '

# Right: agent status (rendered by tmux-ai status) │ HH:MM
set -g status-right \
  '#(~/.local/bin/tmux-ai status) #[fg=#{E:@tmux-ai-sep}]│ #[fg=#{E:@tmux-ai-fg}]%H:%M '

# =========================================================================
# Pane / window ergonomics
# =========================================================================
# Splits that keep cwd; original % and " remain available
bind | split-window -h -c '#{pane_current_path}'
bind -   split-window -v -c '#{pane_current_path}'

# Vim-ish pane movement (arrows still work)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resize
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Reload
bind r source-file ~/.tmux.conf \; display-message 'config reloaded'

# =========================================================================
# Copy mode (vi keys + system clipboard)
# =========================================================================
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line

# Pick the first available clipboard backend.
if-shell 'command -v pbcopy >/dev/null' \
  "bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'pbcopy'" \
  "if-shell 'command -v xclip >/dev/null' \
     \"bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'xclip -selection clipboard'\" \
     \"bind -T copy-mode-vi y send -X copy-pipe-and-cancel 'cat >/dev/null'\""

# =========================================================================
# Agents session — off by default (dashboard via prefix + a covers the
# same use case). To opt in, set this BEFORE sourcing tmux.conf:
#   set -g @tmux-ai-agents-session 'on'
# The if-shell treats an unset option as 'off', so we don't clobber
# user overrides by declaring a default here.
# =========================================================================
if-shell '[ "$(tmux show-options -gv @tmux-ai-agents-session 2>/dev/null || echo off)" = "on" ]' {
  bind g run-shell '~/.local/bin/tmux-ai goto'
  set-hook -g client-attached 'run-shell -b "~/.local/bin/tmux-ai goto --ensure"'
  set-hook -g session-closed  'run-shell -b "~/.local/bin/tmux-ai goto --ensure"'
}

# Source the sibling agent snippet. `#{current_file}` is the path tmux
# opened (often a symlink like ~/.tmux.conf when installed via --full),
# so we readlink -f to get the real repo dir before appending the name.
run-shell 'tmux source-file "$(dirname "$(readlink -f "#{current_file}")")/tmux-ai.tmux.conf"'
